# The context experiment: every model sees exactly the same rows.

seed: 42
seeds: [42]

references: [R3_combined]
include_tso: false
models: [ridge, lightgbm]
featuresets: [S3]

# 50k ist die Obergrenze: Fold 1 hat nur ~52.900 Trainingszeilen.
contexts: [5000, 10000, 20000, 35000, 50000]
daylight_training: false

splits:
  n_folds: 12
  test_days: 90
  gap_hours: 48
  mode: expanding

tuning:
  validation_days: 90
  gap_hours: 48

evaluation:
  normaliser: cap_roll
  daylight_only: true
  skill_reference: R3_combined
  significance: true

output_dir: reports
