# TabPFN-3 on a GPU; references stay off so the merge finds no duplicates.

seed: 42
seeds: [42]

references: []
include_tso: false
models: [tabpfn3]
featuresets: [S3]

# Für die Kontextkurve dieselben Werte wie in context_sweep.yaml setzen.
contexts: [null]
daylight_training: false

splits:
  n_folds: 12
  test_days: 90
  gap_hours: 48
  mode: expanding

tuning:
  validation_days: 90
  gap_hours: 48

evaluation:
  normaliser: cap_roll
  daylight_only: true
  skill_reference: R3_combined
  significance: true

output_dir: reports
