[project]
name = "pv-forecast"
version = "0.1.0"
description = "PV Forecast"
requires-python = ">=3.12"
dependencies = [
    "interpret>=0.7.8",
    "lightgbm>=4.6.0",
    "matplotlib>=3.11.0",
    "notebook>=7.5.7",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pvlib>=0.15.1",
    "pyarrow>=24.0.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "shap>=0.52.0",
]

[dependency-groups]
# TabPFN needs a GPU to be useful and pulls PyTorch, so it stays out of the default
# sync; it runs on Colab, not on the Mac (see docs/arbeitsplan.md).
gpu = [
    "tabpfn>=8.1.0",
]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.5.8",
    "jupytext>=1.19.3",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pvforecast"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
