[project]
name = "pv-forecast"
version = "0.1.0"
description = "PV Forecast"
requires-python = ">=3.12"
dependencies = [
    "interpret>=0.7.8",
    "lightgbm>=4.6.0",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pvlib>=0.15.1",
    "pyarrow>=24.0.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "shap>=0.52.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.5.8",
    "jupytext>=1.19.3",
    "pytest>=9.0.3",
    "ruff>=0.15.17",
]
