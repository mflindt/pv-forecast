[project]
name = "pv-forecast"
version = "0.2.0"
description = "Day-ahead-PV-Prognose für Deutschland"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lightgbm>=4.5",
    "matplotlib>=3.10",
    "numpy>=2.0",
    "pandas>=2.2",
    "pvlib>=0.11",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "requests>=2.32",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
gpu = ["tabpfn>=8.0,<9"]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "notebook>=7.2",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pvforecast"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
